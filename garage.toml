# Garage node configuration (delivered into the container by Coolify file storage)
# GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN arrive as container env vars —
# Garage reads them directly, so they are not set here.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

db_engine = "lmdb"
# Garage v2: replication_mode was replaced by replication_factor + consistency_mode
replication_factor = 1
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.haviv.pro"

# [s3_web] omitted: static website hosting is unused; also its `bind_addr`
# key changed in Garage v2 and rejects the old `api_bind_addr` spelling.

[admin]
api_bind_addr = "[::]:3903"
