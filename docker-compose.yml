# Garage S3-compatible object storage — single-node deployment for Coolify
# Image pinned to a fixed release tag (per Garage docs recommendation).
# All secrets/credentials are supplied by Coolify environment variables:
#   GARAGE_ADMIN_TOKEN - bearer token for the admin API (also used by the UI)
#   GARAGE_RPC_SECRET  - internal RPC secret (single node; required by Garage)
# Domains are routed via Traefik labels (required for compose apps on Coolify:
# docker_compose_domains is rejected by the API on create).

services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage-storage
    restart: unless-stopped
    # NOTE: no `command:` — the image's default CMD is ["/garage","server"];
    # a custom command would REPLACE it and crash ("server: not found in $PATH")
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    # /etc/garage.toml is delivered as a Coolify "file storage" (content injected
    # by the platform) — compose `configs:` is silently dropped by Coolify's parser
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      # ---- S3 API (path-style: https://s3.haviv.pro/<bucket>/<key>) ----
      - traefik.http.routers.garage-s3.rule=Host(`s3.haviv.pro`)
      - traefik.http.routers.garage-s3.entrypoints=https
      - traefik.http.routers.garage-s3.tls.certresolver=letsencrypt
      - traefik.http.routers.garage-s3.service=garage-s3
      - traefik.http.services.garage-s3.loadbalancer.server.port=3900
      # ---- Admin API + built-in web UI ----
      - traefik.http.routers.garage-admin.rule=Host(`garage-admin.haviv.pro`)
      - traefik.http.routers.garage-admin.entrypoints=https
      - traefik.http.routers.garage-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.garage-admin.service=garage-admin
      - traefik.http.services.garage-admin.loadbalancer.server.port=3903

  # TEMPORARY diagnostics container — remove after debugging
  diag:
    image: alpine:3.19
    container_name: garage-diag
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - DIAG_CANARY=${DIAG_CANARY}
    # read the exact host file the garage container mounts
    volumes:
      - /data/coolify/services/76xivg8zn2ptwfixa3uvrmcq/etc/garage.toml:/etc/garage.toml:ro
    command: >
      sh -c "mkdir -p /www;
      if cp /etc/garage.toml /www/garage.toml 2>/dev/null; then echo FILE_OK >> /www/env.txt; else echo FILE_MISSING >> /www/env.txt; fi;
      env | grep -v -E '^(GARAGE_|DIAG_CANARY)' >> /www/env.txt;
      env | grep -E '^(GARAGE_|DIAG_CANARY)' | sed 's/=.*/=<value hidden>/' >> /www/env.txt;
      cd /www && exec httpd -f -p 80 -h /www"
    labels:
      - traefik.enable=true
      - traefik.http.routers.garage-diag.rule=Host(`garage-diag.haviv.pro`)
      - traefik.http.routers.garage-diag.entrypoints=https
      - traefik.http.routers.garage-diag.tls.certresolver=letsencrypt
      - traefik.http.services.garage-diag.loadbalancer.server.port=80

volumes:
  garage_meta:
  garage_data:

networks:
  coolify:
    external: true
